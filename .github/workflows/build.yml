name: Build JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Finds the folder that contains build.gradle (repo root or any subfolder)
      - name: Locate Gradle project
        id: locate
        run: |
          FILE=$(find . -name build.gradle -not -path '*/node_modules/*' -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::No build.gradle found in the repository. Upload the project files first."
            ls -R | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Found Gradle project in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0
          build-root-directory: ${{ steps.locate.outputs.dir }}

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nicked-jar
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar

      # Optional: push a tag like v0.1.0 to publish the jar as a GitHub Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
